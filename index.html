<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>心情日记 · 云同步版</title>
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    color:#3d3a45;background:#fdf8f6;min-height:100vh;
    padding:36px 16px 72px;display:flex;justify-content:center;
    -webkit-font-smoothing:antialiased;
  }
  body::before{
    content:"";position:fixed;inset:0;z-index:-1;
    background:
      radial-gradient(circle at 12% 8%, rgba(255,206,224,.55), transparent 42%),
      radial-gradient(circle at 88% 4%, rgba(198,216,255,.5), transparent 42%),
      radial-gradient(circle at 50% 102%, rgba(203,240,225,.5), transparent 46%);
  }
  ::selection{background:#e2d7ff}
  .wrap{width:100%;max-width:640px}
  header{text-align:center;margin-bottom:26px}
  header h1{
    font-size:27px;font-weight:700;letter-spacing:.5px;
    background:linear-gradient(120deg,#f472a4,#a78bfa,#5b9cf6);
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  header .sub{color:#8d879a;font-size:13.5px;margin-top:9px}

  .card{
    background:rgba(255,255,255,.74);
    backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    border:1px solid rgba(255,255,255,.9);border-radius:24px;
    padding:24px;box-shadow:0 10px 34px rgba(165,145,175,.13);
    margin-bottom:18px;
  }
  .card-title{
    font-size:14px;font-weight:600;color:#6b6478;letter-spacing:.4px;
    margin-bottom:16px;display:flex;align-items:center;justify-content:space-between;
  }
  .card-title small{font-weight:400;color:#a9a2b6;font-size:12px}

  .auth-card{text-align:center;padding:34px 24px}
  .auth-card h2{font-size:18px;color:#5a5465;margin-bottom:6px}
  .auth-card p{font-size:13px;color:#a9a2b6;margin-bottom:20px;line-height:1.6}
  .auth-input{
    width:100%;padding:13px 16px;margin-bottom:11px;
    border-radius:14px;border:1.5px solid #eceaf2;
    background:rgba(255,255,255,.9);font-size:14px;
    font-family:inherit;color:inherit;outline:none;
    transition:border-color .2s,box-shadow .2s;
  }
  .auth-input:focus{border-color:#c9b8f0;box-shadow:0 0 0 4px rgba(200,180,240,.16)}
  .auth-btns{display:flex;gap:10px;margin-top:6px}
  .auth-btns button{
    flex:1;padding:13px;border:none;border-radius:14px;
    font-size:14px;font-weight:600;font-family:inherit;
    cursor:pointer;transition:transform .18s,box-shadow .18s;
  }
  .btn-primary{
    background:linear-gradient(120deg,#ffb0c8,#b9a5f5);color:#fff;
    box-shadow:0 8px 20px -6px rgba(190,150,225,.85);
  }
  .btn-primary:hover{transform:translateY(-2px)}
  .btn-secondary{
    background:rgba(255,255,255,.9);color:#8d879a;
    border:1.5px solid #eceaf2;
  }
  .btn-secondary:hover{background:#fff;color:#5a5465}
  .auth-msg{font-size:12.5px;color:#a9a2b6;margin-top:14px;min-height:16px}
  .auth-msg.err{color:#f472a4}

  .mood-grid{
    display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-bottom:18px;
  }
  .mood-btn{
    display:flex;flex-direction:column;align-items:center;gap:6px;
    padding:12px 2px;border-radius:16px;border:2px solid transparent;
    background:rgba(255,255,255,.62);cursor:pointer;
    font-family:inherit;font-size:11.5px;line-height:1.2;color:#8d879a;
    transition:transform .18s,background .18s,border-color .18s,box-shadow .18s;
    -webkit-tap-highlight-color:transparent;
  }
  .mood-btn .emoji{font-size:24px;line-height:1;transition:transform .18s}
  .mood-btn:hover{transform:translateY(-3px);background:#fff}
  .mood-btn:hover .emoji{transform:scale(1.12)}
  .mood-btn.active{
    background:#fff;border-color:var(--c);color:#5a5465;
    transform:translateY(-3px);box-shadow:0 8px 20px -6px var(--c);
  }
  .mood-btn.active .emoji{transform:scale(1.14)}

  textarea{
    width:100%;min-height:88px;resize:vertical;
    border-radius:16px;border:1.5px solid #eceaf2;
    background:rgba(255,255,255,.85);padding:14px 16px;
    font-size:14px;font-family:inherit;line-height:1.65;
    color:inherit;outline:none;transition:border-color .2s,box-shadow .2s;
  }
  textarea::placeholder{color:#b6b0c2}
  textarea:focus{border-color:#c9b8f0;box-shadow:0 0 0 4px rgba(200,180,240,.16)}

  .save-btn{
    width:100%;margin-top:14px;padding:15px;border:none;border-radius:16px;
    background:linear-gradient(120deg,#ffb0c8,#b9a5f5);color:#fff;
    font-size:15px;font-weight:600;font-family:inherit;letter-spacing:.5px;
    cursor:pointer;box-shadow:0 10px 24px -8px rgba(190,150,225,.85);
    transition:transform .18s,box-shadow .18s,opacity .18s;
  }
  .save-btn:hover{transform:translateY(-2px)}
  .save-btn:active{transform:translateY(0) scale(.99)}
  .save-btn:disabled{opacity:.5;cursor:not-allowed;transform:none;box-shadow:none}

  .hint{text-align:center;font-size:12.5px;color:#a9a2b6;margin-top:11px;min-height:16px}

  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px 10px;text-align:center}
  .stat{padding:4px 2px}
  .stat .num{display:block;font-size:24px;font-weight:700;color:#6b6478;line-height:1.3}
  .stat .num.emoji-num{font-size:26px}
  .stat .lbl{font-size:12px;color:#a9a2b6;letter-spacing:.3px}

  .week{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
  .day{
    position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;
    padding:11px 2px;border-radius:14px;background:rgba(255,255,255,.55);transition:background .2s;
  }
  .day.today{background:#fff;box-shadow:0 0 0 1.5px #e6ddff inset}
  .day-emoji{font-size:20px;line-height:1;height:22px;display:flex;align-items:center}
  .day-emoji .none{color:#d8d3e2;font-size:16px}
  .day-label{font-size:11px;color:#a9a2b6}
  .day.today .day-label{color:#8b7bd8;font-weight:600}
  .day-badge{
    position:absolute;top:3px;right:4px;font-size:9px;line-height:1;
    background:#b9a5f5;color:#fff;border-radius:999px;padding:2px 4px;
    min-width:13px;text-align:center;font-weight:600;
  }

  .day-group{margin-bottom:24px}
  .day-group:last-child{margin-bottom:0}
  .day-head{display:flex;align-items:baseline;gap:9px;padding-bottom:9px;margin-bottom:8px;border-bottom:1px solid #f0ecf6}
  .day-date{font-size:13.5px;font-weight:700;color:#5a5465}
  .day-meta{font-size:11.5px;color:#b0aabe}

  .entry{display:flex;align-items:flex-start;gap:13px;padding:11px 0}
  .entry + .entry{border-top:1px dashed #f3eff8}
  .bubble{width:40px;height:40px;flex-shrink:0;border-radius:50%;display:grid;place-items:center;font-size:20px}
  .entry-main{flex:1;min-width:0}
  .entry-head{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap}
  .entry-mood{font-size:13.5px;font-weight:600;color:#5a5465}
  .entry-time{font-size:11.5px;color:#b0aabe;font-variant-numeric:tabular-nums}
  .entry-note{font-size:13.5px;color:#78717f;line-height:1.65;margin-top:5px;word-break:break-word;white-space:pre-wrap}
  .del{
    flex-shrink:0;width:28px;height:28px;border:none;border-radius:50%;
    background:transparent;color:#ccc6d8;font-size:13px;cursor:pointer;
    font-family:inherit;transition:background .18s,color .18s;display:grid;place-items:center;
  }
  .del:hover{background:#ffe8ee;color:#f472a4}

  .empty-state{text-align:center;color:#b6b0c2;font-size:13.5px;padding:26px 0}

  .actions{display:flex;gap:12px;justify-content:center;margin-top:6px;flex-wrap:wrap}
  .actions button{
    padding:10px 22px;border-radius:999px;border:1px solid rgba(205,196,220,.6);
    background:rgba(255,255,255,.72);font-family:inherit;font-size:13px;
    color:#8d879a;cursor:pointer;transition:background .2s,color .2s,transform .2s;
  }
  .actions button:hover{background:#fff;color:#5a5465;transform:translateY(-1px)}

  .user-bar{
    display:flex;align-items:center;justify-content:space-between;
    gap:10px;margin-bottom:16px;padding:0 4px;
  }
  .user-email{font-size:12.5px;color:#8d879a;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .signout-btn{
    flex-shrink:0;padding:7px 16px;border-radius:999px;border:1px solid #eceaf2;
    background:rgba(255,255,255,.8);font-family:inherit;font-size:12px;
    color:#a9a2b6;cursor:pointer;transition:background .2s,color .2s;
  }
  .signout-btn:hover{background:#fff;color:#f472a4}

  .toast{
    position:fixed;left:50%;bottom:34px;transform:translate(-50%,16px);
    background:rgba(61,58,69,.93);color:#fff;padding:11px 24px;
    border-radius:999px;font-size:13.5px;opacity:0;pointer-events:none;
    transition:opacity .28s,transform .28s;z-index:99;
  }
  .toast.show{opacity:1;transform:translate(-50%,0)}

  .loading-overlay{
    position:fixed;inset:0;display:grid;place-items:center;
    background:rgba(253,248,246,.85);z-index:100;
    font-size:14px;color:#8d879a;
  }

  @media (max-width:520px){ .stats{grid-template-columns:repeat(2,1fr);gap:18px 10px} }
  @media (max-width:420px){
    body{padding:24px 12px 60px}
    .card{padding:19px 15px;border-radius:20px}
    header h1{font-size:23px}
    .mood-grid{gap:7px}
    .mood-btn{padding:10px 1px;font-size:11px;border-radius:14px}
    .mood-btn .emoji{font-size:22px}
    .stat .num{font-size:21px}
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="loading-overlay" id="loadingOverlay">正在加载…</div>

  <header>
    <h1>心情日记</h1>
    <p class="sub" id="todayLabel"></p>
  </header>

  <section class="card auth-card" id="authCard" style="display:none">
    <h2>登录后同步你的心情</h2>
    <p>用邮箱注册或登录，换电脑打开同一网址，记录自动同步。</p>
    <input class="auth-input" type="email" id="authEmail" placeholder="邮箱地址" autocomplete="email">
    <input class="auth-input" type="password" id="authPassword" placeholder="密码（至少 6 位）" autocomplete="current-password">
    <div class="auth-btns">
      <button class="btn-primary" id="loginBtn">登录</button>
      <button class="btn-secondary" id="signupBtn">注册</button>
    </div>
    <p class="auth-msg" id="authMsg"></p>
  </section>

  <div id="mainApp" style="display:none">
    <div class="user-bar">
      <span class="user-email" id="userEmail"></span>
      <button class="signout-btn" id="signoutBtn">退出登录</button>
    </div>

    <section class="card">
      <h2 class="card-title">
        <span>此刻心情怎么样？</span>
        <small id="todayCountHint"></small>
      </h2>
      <div class="mood-grid" id="moodGrid"></div>
      <textarea id="note" maxlength="500" placeholder="记下此刻的想法…（可选）"></textarea>
      <button class="save-btn" id="saveBtn">记录这条心情</button>
      <p class="hint" id="saveHint"></p>
    </section>

    <section class="card stats">
      <div class="stat"><span class="num" id="statTotal">0</span><span class="lbl">记录条数</span></div>
      <div class="stat"><span class="num" id="statDays">0</span><span class="lbl">记录天数</span></div>
      <div class="stat"><span class="num" id="statStreak">0</span><span class="lbl">连续天数</span></div>
      <div class="stat"><span class="num emoji-num" id="statTop">—</span><span class="lbl">最常心情</span></div>
    </section>

    <section class="card">
      <h2 class="card-title">最近 7 天</h2>
      <div class="week" id="week"></div>
    </section>

    <section class="card">
      <h2 class="card-title">我的记录 <small id="countLabel"></small></h2>
      <div id="history"></div>
    </section>

    <div class="actions">
      <button id="refreshBtn">刷新数据</button>
    </div>
  </div>

</div>

<div class="toast" id="toast"></div>

<!-- 引入 Supabase JS 库 -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* =========================================================
   ⚠️ 把下面两行换成你自己的 Supabase 项目信息
========================================================= */
// 注意：URL 末尾不要有斜杠，也不要加 /rest/v1/
const SUPABASE_URL = 'https://sibhjythqeguupfgqxbf.supabase.co'; 
const SUPABASE_ANON_KEY = '191a2351-21ad-4b86-bd9e-a0d8eb54478c';

const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

/* =========================================================
   心情定义（39 种）
========================================================= */
const MOODS = [
  // —— 积极 ——
  { key:'happy',        emoji:'😄', label:'开心',     color:'#FFD93D' },
  { key:'excited',      emoji:'🤩', label:'兴奋',     color:'#FF8FAB' },
  { key:'content',      emoji:'😌', label:'满足',     color:'#FFC48C' },
  { key:'grateful',     emoji:'🙏', label:'感恩',     color:'#C9B8F0' },
  { key:'hopeful',      emoji:'🌱', label:'期待',     color:'#8FD8A8' },
  { key:'proud',        emoji:'😎', label:'自豪',     color:'#FFB347' },
  { key:'loved',        emoji:'🥰', label:'幸福',     color:'#FF9EC4' },
  { key:'inspired',     emoji:'💡', label:'有灵感',   color:'#FFE066' },

  // —— 平静/中性 ——
  { key:'calm',         emoji:'🧘', label:'平静',     color:'#7FD8BE' },
  { key:'relaxed',      emoji:'😌', label:'放松',     color:'#A8E6CF' },
  { key:'meh',          emoji:'😐', label:'一般',     color:'#B8C4D0' },
  { key:'bored',        emoji:'🥱', label:'无聊',     color:'#C5C9D6' },
  { key:'nostalgic',    emoji:'📷', label:'回忆',     color:'#D4B8A0' },
  { key:'unsure',       emoji:'❓', label:'不知道',   color:'#C4BFD6' },
  { key:'robot',        emoji:'🤖', label:'机器人',   color:'#A0A8D0' },
  

  // —— 消极/低落 ——
  { key:'low',          emoji:'😞', label:'低落',     color:'#8FA8D8' },
  { key:'sad',          emoji:'😢', label:'难过',     color:'#7FB3E8' },
  { key:'numb',         emoji:'🫥', label:'情感淡漠', color:'#B0AEBF' },
  { key:'empty',        emoji:'🕳️', label:'虚无',     color:'#A9A2B6' },
  { key:'disappointed', emoji:'😞', label:'失望',     color:'#9FA8C0' },
  { key:'aggrieved',    emoji:'🥺', label:'委屈',     color:'#D0B8C0' },
  { key:'melancholy',   emoji:'😔', label:'惆怅',     color:'#A8B0C0' },
  { key:'depressed',    emoji:'🌧️', label:'抑郁',     color:'#8090A8' },

  // —— 烦躁/焦虑 ——
  { key:'irritated',    emoji:'😤', label:'烦躁',     color:'#F0A868' },
  { key:'anxious',      emoji:'😰', label:'焦虑',     color:'#E8A6C0' },
  { key:'stressed',     emoji:'🤯', label:'压力大',   color:'#F28585' },
  { key:'angry',        emoji:'😡', label:'生气',     color:'#F4756B' },
  { key:'overwhelmed',  emoji:'🌊', label:'崩溃',     color:'#6FA8DC' },
  { key:'jealous',      emoji:'😒', label:'嫉妒',     color:'#B8C48D' },
  { key:'nervous',      emoji:'😬', label:'紧张',     color:'#C8B8A0' },
  { key:'frustrated',   emoji:'😩', label:'挫败',     color:'#D8A080' },
  { key:'helpless',     emoji:'😮‍💨', label:'无奈',     color:'#A0A8B0' },

  // —— 疲惫/身体 ——
  { key:'tired',        emoji:'😴', label:'疲惫',     color:'#A99BE0' },
  { key:'sleepy',       emoji:'💤', label:'困倦',     color:'#B8A9E0' },
  { key:'sick',         emoji:'🤒', label:'不舒服',   color:'#E0A9A9' },

  // —— 社交/表达 ——
  { key:'silent',       emoji:'🤐', label:'不想说话', color:'#9AB8C4' },
  { key:'shy',          emoji:'😳', label:'害羞',     color:'#FFB3C6' },
  { key:'shame',        emoji:'😳', label:'羞耻',     color:'#FFA8C8' },
];
const MOOD_MAP = Object.fromEntries(MOODS.map(m => [m.key, m]));
const UNKNOWN_MOOD = { emoji:'❔', label:'未知', color:'#CCCCCC' };
const WEEK_CN = ['日','一','二','三','四','五','六'];

let currentUser = null;
let records = [];
let selectedMood = null;
let loading = false;

const $ = id => document.getElementById(id);

function fmtKey(d){
  return d.getFullYear() + '-' +
         String(d.getMonth()+1).padStart(2,'0') + '-' +
         String(d.getDate()).padStart(2,'0');
}
function todayKey(){ return fmtKey(new Date()); }
function fmtTime(ts){
  const d = new Date(ts);
  return String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
}
function escapeHtml(str){
  return String(str).replace(/[&<>"']/g, c => (
    { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]
  ));
}
function friendlyDate(key){
  const today = new Date();
  const yest = new Date(); yest.setDate(today.getDate() - 1);
  const [y, m, d] = key.split('-').map(Number);
  const wd = '星期' + WEEK_CN[new Date(y, m-1, d).getDay()];
  if (key === fmtKey(today)) return '今天 · ' + wd;
  if (key === fmtKey(yest))  return '昨天 · ' + wd;
  return (y === today.getFullYear() ? `${m}月${d}日` : `${y}年${m}月${d}日`) + ' · ' + wd;
}

let toastTimer = null;
function toast(msg){
  const el = $('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 1800);
}
function setLoading(show){
  loading = show;
  $('loadingOverlay').style.display = show ? 'grid' : 'none';
}

async function checkSession(){
  setLoading(true);
  const { data: { session } } = await supabase.auth.getSession();
  setLoading(false);

  if (session && session.user) {
    currentUser = session.user;
    showApp();
    await fetchRecords();
  } else {
    showAuth();
  }
}

function showAuth(){
  $('authCard').style.display = 'block';
  $('mainApp').style.display = 'none';
}
function showApp(){
  $('authCard').style.display = 'none';
  $('mainApp').style.display = 'block';
  $('userEmail').textContent = currentUser.email || '已登录用户';
  renderTodayLabel();
}

async function handleLogin(){
  const email = $('authEmail').value.trim();
  const password = $('authPassword').value;
  if (!email || !password) { showAuthMsg('请填写邮箱和密码'); return; }

  setLoading(true);
  const { data, error } = await supabase.auth.signInWithPassword({ email, password });
  setLoading(false);

  if (error) { showAuthMsg(error.message); return; }
  currentUser = data.user;
  $('authMsg').textContent = '';
  $('authPassword').value = '';
  showApp();
  await fetchRecords();
}

async function handleSignup(){
  const email = $('authEmail').value.trim();
  const password = $('authPassword').value;
  if (!email || !password) { showAuthMsg('请填写邮箱和密码'); return; }
  if (password.length < 6) { showAuthMsg('密码至少 6 位'); return; }

  setLoading(true);
  const { data, error } = await supabase.auth.signUp({ email, password });
  setLoading(false);

  if (error) { showAuthMsg(error.message); return; }

  if (data.user && !data.session) {
    showAuthMsg('注册成功！请检查邮箱并点击确认链接后再登录。');
    return;
  }

  currentUser = data.user;
  $('authMsg').textContent = '';
  $('authPassword').value = '';
  showApp();
  await fetchRecords();
}

async function handleSignout(){
  await supabase.auth.signOut();
  currentUser = null;
  records = [];
  selectedMood = null;
  $('note').value = '';
  showAuth();
}

function showAuthMsg(msg){
  const el = $('authMsg');
  el.textContent = msg;
  el.classList.add('err');
}

async function fetchRecords(){
  if (!currentUser) return;
  setLoading(true);
  const { data, error } = await supabase
    .from('moods')
    .select('*')
    .order('time', { ascending: true });
  setLoading(false);

  if (error) { toast('加载失败：' + error.message); return; }

  records = (data || []).map(r => ({
    id: r.id,
    date: r.date,
    mood: r.mood,
    note: r.note || '',
    time: Number(r.time)
  }));

  renderAll();
}

async function insertRecord(mood, note){
  const date = todayKey();
  const time = Date.now();
  const { data, error } = await supabase
    .from('moods')
    .insert({
      user_id: currentUser.id,
      date: date,
      mood: mood,
      note: note,
      time: time
    })
    .select()
    .single();

  if (error) { toast('保存失败：' + error.message); return false; }

  records.push({
    id: data.id,
    date: data.date,
    mood: data.mood,
    note: data.note || '',
    time: Number(data.time)
  });
  return true;
}

async function deleteRecord(id){
  const { error } = await supabase
    .from('moods')
    .delete()
    .eq('id', id);

  if (error) { toast('删除失败：' + error.message); return false; }

  records = records.filter(r => r.id !== id);
  return true;
}

function renderTodayLabel(){
  const d = new Date();
  $('todayLabel').textContent =
    `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日 · 星期${WEEK_CN[d.getDay()]}`;
}

function renderMoodGrid(){
  const grid = $('moodGrid');
  if (grid.dataset.ready === '1') return;
  grid.dataset.ready = '1';

  grid.innerHTML = MOODS.map(m => `
    <button class="mood-btn" data-key="${m.key}" style="--c:${m.color}" type="button">
      <span class="emoji">${m.emoji}</span>
      <span>${m.label}</span>
    </button>
  `).join('');

  grid.addEventListener('click', e => {
    const btn = e.target.closest('.mood-btn');
    if (!btn) return;
    selectedMood = (selectedMood === btn.dataset.key) ? null : btn.dataset.key;
    updateMoodSelection();
    updateSaveButton();
  });
}

function updateMoodSelection(){
  document.querySelectorAll('.mood-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.key === selectedMood);
  });
}
function updateSaveButton(){
  $('saveBtn').disabled = !selectedMood || loading;
}

function calcStreak(){
  const dateSet = new Set(records.map(r => r.date));
  let streak = 0;
  const d = new Date();
  if (!dateSet.has(fmtKey(d))) d.setDate(d.getDate() - 1);
  while (dateSet.has(fmtKey(d))) {
    streak++;
    d.setDate(d.getDate() - 1);
  }
  return streak;
}

function renderStats(){
  const dateSet = new Set(records.map(r => r.date));
  const counts = {};
  records.forEach(r => { counts[r.mood] = (counts[r.mood] || 0) + 1; });

  $('statTotal').textContent  = records.length;
  $('statDays').textContent   = dateSet.size;
  $('statStreak').textContent = calcStreak();

  const top = Object.entries(counts).sort((a, b) => b[1] - a[1])[0];
  $('statTop').textContent = top ? (MOOD_MAP[top[0]] || UNKNOWN_MOOD).emoji : '—';
}

function renderWeek(){
  const byDate = groupByDate(records);
  let html = '';
  for (let i = 6; i >= 0; i--) {
    const d = new Date();
    d.setDate(d.getDate() - i);
    const key = fmtKey(d);
    const arr = byDate[key] || [];
    const latest = arr.length ? arr[arr.length - 1] : null;
    const mood = latest ? (MOOD_MAP[latest.mood] || UNKNOWN_MOOD) : null;

    html += `
      <div class="day ${i === 0 ? 'today' : ''}">
        ${arr.length > 1 ? `<span class="day-badge">${arr.length}</span>` : ''}
        <div class="day-emoji">${mood ? mood.emoji : '<span class="none">·</span>'}</div>
        <div class="day-label">${d.getDate()}</div>
      </div>`;
  }
  $('week').innerHTML = html;
}

function groupByDate(list){
  const map = {};
  list.forEach(r => {
    if (!map[r.date]) map[r.date] = [];
    map[r.date].push(r);
  });
  Object.values(map).forEach(arr => arr.sort((a, b) => a.time - b.time));
  return map;
}

function entryHtml(date, r){
  const m = MOOD_MAP[r.mood] || UNKNOWN_MOOD;
  return `
    <div class="entry">
      <div class="bubble" style="background:${m.color}26">${m.emoji}</div>
      <div class="entry-main">
        <div class="entry-head">
          <span class="entry-mood">${m.label}</span>
          <span class="entry-time">${fmtTime(r.time)}</span>
        </div>
        ${r.note ? `<p class="entry-note">${escapeHtml(r.note)}</p>` : ''}
      </div>
      <button class="del" data-id="${r.id}" type="button" title="删除">✕</button>
    </div>`;
}

function renderHistory(){
  const byDate = groupByDate(records);
  const days = Object.keys(byDate).sort().reverse();
  const box = $('history');

  $('countLabel').textContent = records.length ? `共 ${records.length} 条` : '';

  if (!days.length) {
    box.innerHTML = '<p class="empty-state">还没有记录，从今天开始吧 🌱</p>';
    return;
  }

  box.innerHTML = days.map(date => {
    const recs = byDate[date];
    return `
      <div class="day-group">
        <div class="day-head">
          <span class="day-date">${friendlyDate(date)}</span>
          <span class="day-meta">${recs.length} 条</span>
        </div>
        ${recs.map(r => entryHtml(date, r)).join('')}
      </div>`;
  }).join('');
}

function renderAll(){
  renderStats();
  renderWeek();
  renderHistory();

  const today = todayKey();
  const todays = records.filter(r => r.date === today);
  $('todayCountHint').textContent = todays.length ? `今天已记 ${todays.length} 条` : '';
  $('saveHint').textContent = todays.length
    ? '今天还可以继续记录，每一条都会单独保存 ✨'
    : '一天可以记录很多次，想到就来写一句吧';

  updateSaveButton();
}

async function handleSave(){
  if (!selectedMood) { toast('先选一个心情吧 🙂'); return; }
  if (!currentUser) { toast('请先登录'); return; }

  $('saveBtn').disabled = true;
  const ok = await insertRecord(selectedMood, $('note').value.trim());

  if (ok) {
    selectedMood = null;
    $('note').value = '';
    updateMoodSelection();
    renderAll();
    toast('已同步记录 ✨');
  }
  updateSaveButton();
}

function bindEvents(){
  $('loginBtn').addEventListener('click', handleLogin);
  $('signupBtn').addEventListener('click', handleSignup);
  $('signoutBtn').addEventListener('click', handleSignout);
  $('saveBtn').addEventListener('click', handleSave);
  $('refreshBtn').addEventListener('click', fetchRecords);

  $('authPassword').addEventListener('keydown', e => {
    if (e.key === 'Enter') handleLogin();
  });

  $('note').addEventListener('keydown', e => {
    if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
      e.preventDefault();
      handleSave();
    }
  });

  $('history').addEventListener('click', async e => {
    const btn = e.target.closest('.del');
    if (!btn) return;
    const id = btn.dataset.id;
    const rec = records.find(r => r.id === id);
    if (!rec) return;
    const label = (MOOD_MAP[rec.mood] || UNKNOWN_MOOD).label;
    if (!confirm(`确定删除这条记录吗？\n${friendlyDate(rec.date)} ${fmtTime(rec.time)} ${label}`)) return;

    setLoading(true);
    const ok = await deleteRecord(id);
    setLoading(false);
    if (ok) { renderAll(); toast('已删除'); }
  });
}

(async function init(){
  renderMoodGrid();
  bindEvents();
  renderTodayLabel();
  await checkSession();
})();
</script>
</body>
</html>
