<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>心情日记 · Mood Diary</title>
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

  body{
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    color:#3d3a45;
    background:#fdf8f6;
    min-height:100vh;
    padding:36px 16px 72px;
    display:flex;
    justify-content:center;
    -webkit-font-smoothing:antialiased;
  }
  body::before{
    content:"";
    position:fixed;inset:0;z-index:-1;
    background:
      radial-gradient(circle at 12% 8%, rgba(255,206,224,.55), transparent 42%),
      radial-gradient(circle at 88% 4%, rgba(198,216,255,.5), transparent 42%),
      radial-gradient(circle at 50% 102%, rgba(203,240,225,.5), transparent 46%);
  }
  ::selection{background:#e2d7ff}

  .wrap{width:100%;max-width:640px}

  /* ---------- 头部 ---------- */
  header{text-align:center;margin-bottom:26px}
  header h1{
    font-size:27px;font-weight:700;letter-spacing:.5px;
    background:linear-gradient(120deg,#f472a4,#a78bfa,#5b9cf6);
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  header .sub{color:#8d879a;font-size:13.5px;margin-top:9px}

  /* ---------- 卡片 ---------- */
  .card{
    background:rgba(255,255,255,.74);
    backdrop-filter:blur(14px);
    -webkit-backdrop-filter:blur(14px);
    border:1px solid rgba(255,255,255,.9);
    border-radius:24px;
    padding:24px;
    box-shadow:0 10px 34px rgba(165,145,175,.13);
    margin-bottom:18px;
  }
  .card-title{
    font-size:14px;font-weight:600;color:#6b6478;
    letter-spacing:.4px;margin-bottom:16px;
    display:flex;align-items:center;justify-content:space-between;
  }
  .card-title small{font-weight:400;color:#a9a2b6;font-size:12px}

  /* ---------- 心情选择 ---------- */
  .mood-grid{
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:9px;
    margin-bottom:18px;
  }
  .mood-btn{
    display:flex;flex-direction:column;align-items:center;gap:6px;
    padding:12px 2px;
    border-radius:16px;
    border:2px solid transparent;
    background:rgba(255,255,255,.62);
    cursor:pointer;
    font-family:inherit;
    font-size:11.5px;
    line-height:1.2;
    color:#8d879a;
    transition:transform .18s ease, background .18s ease, border-color .18s ease, box-shadow .18s ease;
    -webkit-tap-highlight-color:transparent;
  }
  .mood-btn .emoji{font-size:24px;line-height:1;transition:transform .18s ease}
  .mood-btn:hover{transform:translateY(-3px);background:#fff}
  .mood-btn:hover .emoji{transform:scale(1.12)}
  .mood-btn.active{
    background:#fff;
    border-color:var(--c);
    color:#5a5465;
    transform:translateY(-3px);
    box-shadow:0 8px 20px -6px var(--c);
  }
  .mood-btn.active .emoji{transform:scale(1.14)}

  /* ---------- 输入框 ---------- */
  textarea{
    width:100%;
    min-height:88px;
    resize:vertical;
    border-radius:16px;
    border:1.5px solid #eceaf2;
    background:rgba(255,255,255,.85);
    padding:14px 16px;
    font-size:14px;
    font-family:inherit;
    line-height:1.65;
    color:inherit;
    outline:none;
    transition:border-color .2s, box-shadow .2s;
  }
  textarea::placeholder{color:#b6b0c2}
  textarea:focus{
    border-color:#c9b8f0;
    box-shadow:0 0 0 4px rgba(200,180,240,.16);
  }

  /* ---------- 保存按钮 ---------- */
  .save-btn{
    width:100%;
    margin-top:14px;
    padding:15px;
    border:none;
    border-radius:16px;
    background:linear-gradient(120deg,#ffb0c8,#b9a5f5);
    color:#fff;
    font-size:15px;
    font-weight:600;
    font-family:inherit;
    letter-spacing:.5px;
    cursor:pointer;
    box-shadow:0 10px 24px -8px rgba(190,150,225,.85);
    transition:transform .18s ease, box-shadow .18s ease, opacity .18s ease;
  }
  .save-btn:hover{transform:translateY(-2px);box-shadow:0 14px 28px -8px rgba(190,150,225,.95)}
  .save-btn:active{transform:translateY(0) scale(.99)}
  .save-btn.dim{opacity:.55;box-shadow:none}
  .save-btn.dim:hover{transform:none;box-shadow:none}

  .hint{
    text-align:center;font-size:12.5px;color:#a9a2b6;
    margin-top:11px;min-height:16px;
  }

  /* ---------- 统计 ---------- */
  .stats{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:14px 10px;
    text-align:center;
  }
  .stat{padding:4px 2px}
  .stat .num{
    display:block;
    font-size:24px;
    font-weight:700;
    color:#6b6478;
    line-height:1.3;
  }
  .stat .num.emoji-num{font-size:26px}
  .stat .lbl{font-size:12px;color:#a9a2b6;letter-spacing:.3px}

  /* ---------- 最近7天 ---------- */
  .week{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
  .day{
    position:relative;
    display:flex;flex-direction:column;align-items:center;gap:6px;
    padding:11px 2px;
    border-radius:14px;
    background:rgba(255,255,255,.55);
    transition:background .2s;
  }
  .day.today{background:#fff;box-shadow:0 0 0 1.5px #e6ddff inset}
  .day-emoji{font-size:20px;line-height:1;height:22px;display:flex;align-items:center}
  .day-emoji .none{color:#d8d3e2;font-size:16px}
  .day-label{font-size:11px;color:#a9a2b6}
  .day.today .day-label{color:#8b7bd8;font-weight:600}
  .day-badge{
    position:absolute;top:3px;right:4px;
    font-size:9px;line-height:1;
    background:#b9a5f5;color:#fff;
    border-radius:999px;
    padding:2px 4px;
    min-width:13px;text-align:center;
    font-weight:600;
  }

  /* ---------- 历史记录 ---------- */
  .day-group{margin-bottom:24px}
  .day-group:last-child{margin-bottom:0}
  .day-head{
    display:flex;align-items:baseline;gap:9px;
    padding-bottom:9px;margin-bottom:8px;
    border-bottom:1px solid #f0ecf6;
  }
  .day-date{font-size:13.5px;font-weight:700;color:#5a5465}
  .day-meta{font-size:11.5px;color:#b0aabe}

  .entry{
    display:flex;
    align-items:flex-start;
    gap:13px;
    padding:11px 0;
  }
  .entry + .entry{border-top:1px dashed #f3eff8}
  .bubble{
    width:40px;height:40px;flex-shrink:0;
    border-radius:50%;
    display:grid;place-items:center;
    font-size:20px;
  }
  .entry-main{flex:1;min-width:0}
  .entry-head{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap}
  .entry-mood{font-size:13.5px;font-weight:600;color:#5a5465}
  .entry-time{font-size:11.5px;color:#b0aabe;font-variant-numeric:tabular-nums}
  .entry-note{
    font-size:13.5px;
    color:#78717f;
    line-height:1.65;
    margin-top:5px;
    word-break:break-word;
    white-space:pre-wrap;
  }
  .del{
    flex-shrink:0;
    width:28px;height:28px;
    border:none;border-radius:50%;
    background:transparent;
    color:#ccc6d8;
    font-size:13px;
    cursor:pointer;
    font-family:inherit;
    transition:background .18s, color .18s;
    display:grid;place-items:center;
  }
  .del:hover{background:#ffe8ee;color:#f472a4}

  .empty-state{
    text-align:center;
    color:#b6b0c2;
    font-size:13.5px;
    padding:26px 0;
  }

  /* ---------- 底部操作 ---------- */
  .actions{display:flex;gap:12px;justify-content:center;margin-top:6px}
  .actions button,.actions label{
    padding:10px 22px;
    border-radius:999px;
    border:1px solid rgba(205,196,220,.6);
    background:rgba(255,255,255,.72);
    font-family:inherit;
    font-size:13px;
    color:#8d879a;
    cursor:pointer;
    transition:background .2s, color .2s, transform .2s;
  }
  .actions button:hover,.actions label:hover{
    background:#fff;color:#5a5465;transform:translateY(-1px);
  }

  /* ---------- Toast ---------- */
  .toast{
    position:fixed;
    left:50%;bottom:34px;
    transform:translate(-50%,16px);
    background:rgba(61,58,69,.93);
    color:#fff;
    padding:11px 24px;
    border-radius:999px;
    font-size:13.5px;
    opacity:0;
    pointer-events:none;
    transition:opacity .28s, transform .28s;
    z-index:99;
  }
  .toast.show{opacity:1;transform:translate(-50%,0)}

  @media (max-width:520px){
    .stats{grid-template-columns:repeat(2,1fr);gap:18px 10px}
  }
  @media (max-width:420px){
    body{padding:24px 12px 60px}
    .card{padding:19px 15px;border-radius:20px}
    header h1{font-size:23px}
    .mood-grid{gap:7px}
    .mood-btn{padding:10px 1px;font-size:11px;border-radius:14px}
    .mood-btn .emoji{font-size:22px}
    .stat .num{font-size:21px}
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <h1>心情日记</h1>
    <p class="sub" id="todayLabel"></p>
  </header>

  <!-- 记录此刻 -->
  <section class="card">
    <h2 class="card-title">
      <span>此刻心情怎么样？</span>
      <small id="todayCountHint"></small>
    </h2>
    <div class="mood-grid" id="moodGrid"></div>
    <textarea id="note" maxlength="500" placeholder="记下此刻的想法…（可选）"></textarea>
    <button class="save-btn" id="saveBtn">记录这条心情</button>
    <p class="hint" id="saveHint"></p>
  </section>

  <!-- 统计 -->
  <section class="card stats">
    <div class="stat"><span class="num" id="statTotal">0</span><span class="lbl">记录条数</span></div>
    <div class="stat"><span class="num" id="statDays">0</span><span class="lbl">记录天数</span></div>
    <div class="stat"><span class="num" id="statStreak">0</span><span class="lbl">连续天数</span></div>
    <div class="stat"><span class="num emoji-num" id="statTop">—</span><span class="lbl">最常心情</span></div>
  </section>

  <!-- 最近 7 天 -->
  <section class="card">
    <h2 class="card-title">最近 7 天</h2>
    <div class="week" id="week"></div>
  </section>

  <!-- 全部记录 -->
  <section class="card">
    <h2 class="card-title">我的记录 <small id="countLabel"></small></h2>
    <div id="history"></div>
  </section>

  <div class="actions">
    <button id="exportBtn">导出备份</button>
    <label>导入备份<input type="file" id="importInput" accept=".json,application/json" hidden></label>
  </div>

</div>

<div class="toast" id="toast"></div>

<script>
/* =========================================================
   心情定义（29 种）
========================================================= */
const MOODS = [
  // —— 积极 ——
  { key:'happy',     emoji:'😄', label:'开心',     color:'#FFD93D' },
  { key:'excited',   emoji:'🤩', label:'兴奋',     color:'#FF8FAB' },
  { key:'content',   emoji:'😊', label:'满足',     color:'#FFC48C' },
  { key:'grateful',  emoji:'🙏', label:'感恩',     color:'#C9B8F0' },
  { key:'hopeful',   emoji:'🌱', label:'期待',     color:'#8FD8A8' },
  { key:'proud',     emoji:'😎', label:'自豪',     color:'#FFB347' },
  { key:'loved',     emoji:'🥰', label:'被爱',     color:'#FF9EC4' },
  { key:'inspired',  emoji:'💡', label:'有灵感',   color:'#FFE066' },

  // —— 平静/中性 ——
  { key:'calm',      emoji:'😌', label:'平静',     color:'#7FD8BE' },
  { key:'relaxed',   emoji:'🍃', label:'放松',     color:'#A8E6CF' },
  { key:'meh',       emoji:'😐', label:'一般',     color:'#B8C4D0' },
  { key:'bored',     emoji:'🥱', label:'无聊',     color:'#C5C9D6' },
  { key:'thinking', emoji:'🤔', label:'思考',     color:'#D4B8A0' },
  { key:'unsure',    emoji:'❓', label:'不知道',   color:'#C4BFD6' },

  // —— 消极/低落 ——
  { key:'low',       emoji:'😞', label:'低落',     color:'#8FA8D8' },
  { key:'sad',       emoji:'😢', label:'难过',     color:'#7FB3E8' },
  { key:'lonely',    emoji:'🫂', label:'孤独',     color:'#A0A8D0' },
  { key:'numb',      emoji:'🫥', label:'情感淡漠', color:'#B0AEBF' },
  { key:'empty',     emoji:'🕳️', label:'空虚',     color:'#A9A2B6' },
  { key:'disappointed', emoji:'😕', label:'失望',  color:'#9FA8C0' },

  // —— 烦躁/焦虑 ——
  { key:'irritated', emoji:'😤', label:'烦躁',     color:'#F0A868' },
  { key:'anxious',   emoji:'😰', label:'焦虑',     color:'#E8A6C0' },
  { key:'stressed',  emoji:'🤯', label:'压力大',   color:'#F28585' },
  { key:'angry',     emoji:'😡', label:'生气',     color:'#F4756B' },
  { key:'overwhelmed', emoji:'🌊', label:'崩溃',   color:'#6FA8DC' },

  // —— 疲惫/身体 ——
  { key:'tired',     emoji:'😴', label:'疲惫',     color:'#A99BE0' },
  { key:'sleepy',    emoji:'💤', label:'困倦',     color:'#B8A9E0' },
  { key:'sick',      emoji:'🤒', label:'不舒服',   color:'#E0A9A9' },

  // —— 社交/表达 ——
  { key:'silent',    emoji:'🤐', label:'不想说话', color:'#9AB8C4' },
  { key:'shy',       emoji:'😳', label:'害羞',     color:'#FFB3C6' },
];
const MOOD_MAP = Object.fromEntries(MOODS.map(m => [m.key, m]));
const UNKNOWN_MOOD = { emoji:'❔', label:'未知', color:'#CCCCCC' };

const STORAGE_KEY = 'mood-diary-v1';
const WEEK_CN = ['日','一','二','三','四','五','六'];

/* =========================================================
   状态
========================================================= */
let data = loadData();      // { '2026-09-21': [ {id,mood,note,time}, ... ] }
let selectedMood = null;

/* =========================================================
   工具
========================================================= */
const $ = id => document.getElementById(id);

function uid(){
  return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
}
function fmtKey(d){
  return d.getFullYear() + '-' +
         String(d.getMonth()+1).padStart(2,'0') + '-' +
         String(d.getDate()).padStart(2,'0');
}
function todayKey(){ return fmtKey(new Date()); }
function fmtTime(ts){
  const d = new Date(ts);
  return String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
}
function escapeHtml(str){
  return String(str).replace(/[&<>"']/g, c => (
    { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]
  ));
}
function friendlyDate(key){
  const today = new Date();
  const yest = new Date(); yest.setDate(today.getDate() - 1);
  const [y, m, d] = key.split('-').map(Number);
  const wd = '星期' + WEEK_CN[new Date(y, m-1, d).getDay()];
  if (key === fmtKey(today)) return '今天 · ' + wd;
  if (key === fmtKey(yest))  return '昨天 · ' + wd;
  return (y === today.getFullYear() ? `${m}月${d}日` : `${y}年${m}月${d}日`) + ' · ' + wd;
}

/* =========================================================
   数据规范化 / 读写（兼容旧版"一天一条"格式）
========================================================= */
function normalize(raw){
  const out = {};
  if (!raw || typeof raw !== 'object' || Array.isArray(raw)) return out;

  Object.entries(raw).forEach(([k, v]) => {
    if (!/^\d{4}-\d{2}-\d{2}$/.test(k)) return;

    let arr = [];
    if (Array.isArray(v)) arr = v;
    else if (v && typeof v === 'object' && v.mood) arr = [v];   // 旧格式

    const clean = arr
      .filter(r => r && typeof r === 'object' && typeof r.mood === 'string')
      .map(r => ({
        id:   (typeof r.id === 'string' && r.id) ? r.id : uid(),
        mood: r.mood,
        note: typeof r.note === 'string' ? r.note : '',
        time: (typeof r.time === 'number' && isFinite(r.time)) ? r.time : Date.now()
      }))
      .sort((a, b) => a.time - b.time);

    if (clean.length) out[k] = clean;
  });
  return out;
}

function loadData(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    return normalize(raw ? JSON.parse(raw) : {});
  }catch(e){ return {}; }
}
function persist(){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
  }catch(e){
    toast('存储空间不足，保存失败 😢');
  }
}

/* =========================================================
   Toast
========================================================= */
let toastTimer = null;
function toast(msg){
  const el = $('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 1800);
}

/* =========================================================
   渲染：日期标题
========================================================= */
function renderTodayLabel(){
  const d = new Date();
  $('todayLabel').textContent =
    `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日 · 星期${WEEK_CN[d.getDay()]}`;
}

/* =========================================================
   渲染：心情选择器（只初始化一次）
========================================================= */
function renderMoodGrid(){
  const grid = $('moodGrid');
  grid.innerHTML = MOODS.map(m => `
    <button class="mood-btn" data-key="${m.key}" style="--c:${m.color}" type="button">
      <span class="emoji">${m.emoji}</span>
      <span>${m.label}</span>
    </button>
  `).join('');

  grid.addEventListener('click', e => {
    const btn = e.target.closest('.mood-btn');
    if (!btn) return;
    selectedMood = (selectedMood === btn.dataset.key) ? null : btn.dataset.key;
    updateMoodSelection();
    updateSaveButton();
  });
}

function updateMoodSelection(){
  document.querySelectorAll('.mood-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.key === selectedMood);
  });
}
function updateSaveButton(){
  $('saveBtn').classList.toggle('dim', !selectedMood);
}

/* =========================================================
   渲染：统计
========================================================= */
function calcStreak(){
  let streak = 0;
  const d = new Date();
  if (!data[fmtKey(d)]) d.setDate(d.getDate() - 1);   // 今天还没记，从昨天算起
  while (data[fmtKey(d)]) {
    streak++;
    d.setDate(d.getDate() - 1);
  }
  return streak;
}

function renderStats(){
  const days = Object.keys(data);
  let total = 0;
  const counts = {};

  days.forEach(k => {
    total += data[k].length;
    data[k].forEach(r => {
      counts[r.mood] = (counts[r.mood] || 0) + 1;
    });
  });

  $('statTotal').textContent  = total;
  $('statDays').textContent   = days.length;
  $('statStreak').textContent = calcStreak();

  const top = Object.entries(counts).sort((a, b) => b[1] - a[1])[0];
  $('statTop').textContent = top ? (MOOD_MAP[top[0]] || UNKNOWN_MOOD).emoji : '—';
}

/* =========================================================
   渲染：最近 7 天
========================================================= */
function renderWeek(){
  let html = '';
  for (let i = 6; i >= 0; i--) {
    const d = new Date();
    d.setDate(d.getDate() - i);
    const recs = data[fmtKey(d)];
    const latest = recs && recs.length ? recs[recs.length - 1] : null;
    const mood = latest ? (MOOD_MAP[latest.mood] || UNKNOWN_MOOD) : null;

    html += `
      <div class="day ${i === 0 ? 'today' : ''}">
        ${recs && recs.length > 1 ? `<span class="day-badge">${recs.length}</span>` : ''}
        <div class="day-emoji">${mood ? mood.emoji : '<span class="none">·</span>'}</div>
        <div class="day-label">${d.getDate()}</div>
      </div>`;
  }
  $('week').innerHTML = html;
}

/* =========================================================
   渲染：全部记录（按天分组，一天可多条）
========================================================= */
function entryHtml(date, r){
  const m = MOOD_MAP[r.mood] || UNKNOWN_MOOD;
  return `
    <div class="entry">
      <div class="bubble" style="background:${m.color}26">${m.emoji}</div>
      <div class="entry-main">
        <div class="entry-head">
          <span class="entry-mood">${m.label}</span>
          <span class="entry-time">${fmtTime(r.time)}</span>
        </div>
        ${r.note ? `<p class="entry-note">${escapeHtml(r.note)}</p>` : ''}
      </div>
      <button class="del" data-date="${date}" data-id="${r.id}" type="button" title="删除">✕</button>
    </div>`;
}

function renderHistory(){
  const days = Object.keys(data).sort().reverse();
  const box = $('history');
  const totalCount = days.reduce((s, k) => s + data[k].length, 0);

  $('countLabel').textContent = totalCount ? `共 ${totalCount} 条` : '';

  if (!days.length) {
    box.innerHTML = '<p class="empty-state">还没有记录，从今天开始吧 🌱</p>';
    return;
  }

  box.innerHTML = days.map(date => {
    const recs = data[date].slice().sort((a, b) => a.time - b.time);
    return `
      <div class="day-group">
        <div class="day-head">
          <span class="day-date">${friendlyDate(date)}</span>
          <span class="day-meta">${recs.length} 条</span>
        </div>
        ${recs.map(r => entryHtml(date, r)).join('')}
      </div>`;
  }).join('');
}

/* =========================================================
   渲染：全部
========================================================= */
function renderAll(){
  renderTodayLabel();
  renderStats();
  renderWeek();
  renderHistory();

  const todays = data[todayKey()] || [];
  $('todayCountHint').textContent = todays.length ? `今天已记 ${todays.length} 条` : '';
  $('saveHint').textContent = todays.length
    ? '今天还可以继续记录，每一条都会单独保存 ✨'
    : '一天可以记录很多次，想到就来写一句吧';
}

/* =========================================================
   保存一条新记录
========================================================= */
function handleSave(){
  if (!selectedMood) {
    toast('先选一个心情吧 🙂');
    return;
  }
  const date = todayKey();
  if (!data[date]) data[date] = [];

  data[date].push({
    id: uid(),
    mood: selectedMood,
    note: $('note').value.trim(),
    time: Date.now()
  });
  // 保证按时间升序
  data[date].sort((a, b) => a.time - b.time);

  persist();

  // 清空表单，方便接着记下一条
  selectedMood = null;
  $('note').value = '';
  updateMoodSelection();
  updateSaveButton();

  renderAll();
  toast('已记下这一刻 ✨');
}

/* =========================================================
   删除一条记录
========================================================= */
function deleteRecord(date, id){
  const arr = data[date];
  if (!arr) return;
  const idx = arr.findIndex(r => r.id === id);
  if (idx === -1) return;
  arr.splice(idx, 1);
  if (!arr.length) delete data[date];
  persist();
  renderAll();
  toast('已删除');
}

/* =========================================================
   导出 / 导入
========================================================= */
function exportData(){
  if (!Object.keys(data).length) { toast('还没有记录可以导出'); return; }
  const blob = new Blob([JSON.stringify(data, null, 2)], { type:'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `心情日记-${todayKey()}.json`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
  toast('已导出备份 📦');
}

function importData(file){
  const reader = new FileReader();
  reader.onload = () => {
    try{
      const parsed = JSON.parse(reader.result);
      const incoming = normalize(parsed);
      const keys = Object.keys(incoming);
      if (!keys.length) { toast('没有找到可导入的记录'); return; }

      let added = 0;
      keys.forEach(date => {
        if (!data[date]) data[date] = [];
        const existing = new Set(data[date].map(r => r.id));
        incoming[date].forEach(r => {
          if (!existing.has(r.id)) { data[date].push(r); added++; }
        });
        data[date].sort((a, b) => a.time - b.time);
      });

      persist();
      renderAll();
      toast(`导入成功，新增 ${added} 条 🎉`);
    }catch(e){
      toast('文件格式不正确 😵');
    }
  };
  reader.readAsText(file);
}

/* =========================================================
   事件绑定
========================================================= */
function bindEvents(){
  $('saveBtn').addEventListener('click', handleSave);

  // Ctrl / Cmd + Enter 快捷保存
  $('note').addEventListener('keydown', e => {
    if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
      e.preventDefault();
      handleSave();
    }
  });

  // 删除（事件委托）
  $('history').addEventListener('click', e => {
    const btn = e.target.closest('.del');
    if (!btn) return;
    const { date, id } = btn.dataset;
    const rec = (data[date] || []).find(r => r.id === id);
    const label = rec ? (MOOD_MAP[rec.mood] || UNKNOWN_MOOD).label : '';
    if (!confirm(`确定删除这条记录吗？\n${friendlyDate(date)} ${rec ? fmtTime(rec.time) : ''} ${label}`)) return;
    deleteRecord(date, id);
  });

  $('exportBtn').addEventListener('click', exportData);

  $('importInput').addEventListener('change', e => {
    const file = e.target.files && e.target.files[0];
    if (file) importData(file);
    e.target.value = '';
  });
}

/* =========================================================
   启动
========================================================= */
(function init(){
  renderMoodGrid();
  updateSaveButton();
  renderAll();
  bindEvents();
})();
</script>
</body>
</html>
